<!DOCTYPE html>
<html>
<head>
  <title>CSS Day 1 Task</title>

  <style>
    h1 {
      color: blue;
      font-size: 32px;
      text-align: center;   /* centered text */
    }

    p {
      color: green;
      font-size: 18px;
    }

    .second-para {
      color: red;
      font-size: 14px;
    }
  </style>

</head>
<body>

  <h1>Welcome to CSS</h1>

  <p>This is my first paragraph styled with CSS.</p>

  <p class="second-para">
    This is my second paragraph with different color and size.
  </p>

</body>
</html>
