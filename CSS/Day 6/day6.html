<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Day 6</title>
    <link rel="stylesheet" href="day6.css">
</head>
<body>
    <!-- Task 1: Wrapping Cards -->
    <h3>Task 1: Wrapping Cards</h3>
    <div class="wrap-container">
      <div class="wrap-card">1</div>
      <div class="wrap-card">2</div>
      <div class="wrap-card">3</div>
      <div class="wrap-card">4</div>
      <div class="wrap-card">5</div>
    </div>

    <hr>

    <!-- Task 2: Grow Difference -->
    <h3>Task 2: Grow Difference</h3>
    <div class="grow-container">
      <div class="grow-box">Left</div>
      <div class="grow-box middle">Middle</div>
      <div class="grow-box">Right</div>
    </div>

    <hr>

    <!-- Task 3: align-content Test -->
    <h3>Task 3: align-content</h3>
    <div class="align-container">
      <div class="align-box">1</div>
      <div class="align-box">2</div>
      <div class="align-box">3</div>
      <div class="align-box">4</div>
      <div class="align-box">5</div>
      <div class="align-box">6</div>
      <div class="align-box">7</div>
      <div class="align-box">8</div>
    </div>
    
</body>
</html>
