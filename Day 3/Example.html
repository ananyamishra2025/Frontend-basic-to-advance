<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
</head>
<body>
    <h1>Some example of lists</h1>

    <!-- Unordered list -->
    <ul style="list-style-type:square">
      <li>Java</li>
      <li>HTML</li>
      <li>CSS</li>
    </ul>

    <!-- Ordered list -->
    <ol type="I">
      <li>Wake up</li>
      <li>Study</li>
      <li>Practice</li>
    </ol>

    <!-- Nested list -->
    <ul>
    <li>Frontend
        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </li>

    <li>Backend
        <ul>
            <li>Java</li>
            <li>Node.js</li>
        </ul>
    </li>
    </ul>

    <!-- Ordered list with different type -->
    <ol type="A">
      <li>First</li>
      <li>Second</li>
    </ol>

    <!-- Description list -->
    <h2>Basics of Web Development</h2>
    <dl>
      <dt>HTML</dt>
      <dd>Structure of a webpage</dd>

      <dt>CSS</dt>
      <dd>Styles the webpage</dd>
    </dl>

</body>
</html>
