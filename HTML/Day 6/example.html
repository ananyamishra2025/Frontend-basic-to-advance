<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
</head>
<body>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Ananya</td>
            <td>90</td>
        </tr>
    </table>
    <br>

    <table border="1">
        <caption>Student Marks</caption>
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td>Ananya</td>
            <td>HTML</td>
            <td>92</td>
        </tr>
        <tr>
            <td>Ravi</td>
            <td>CSS</td>
            <td>88</td>
        </tr>
    </table>
    <br>

    <table border="1">
        <thead>
            <tr>
                <th>Name</th>
                <th>Marks</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Ananya</td>
                <td>90</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td>90</td>
            </tr>
        </tfoot>
</table>
</body>
</html>
