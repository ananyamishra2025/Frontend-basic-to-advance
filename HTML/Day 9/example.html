<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Example</title>
</head>
<body>
    <tag attribute="value">Content</tag>
    <p title="This is a paragraph">Hello</p>
    <h1 id="main-title">Welcome</h1>
    <p id="text1">One</p>
    <p id="text2">Two</p>
    <p class="info">HTML is easy</p>
    <p class="info">Practice daily</p>
    <p class="info highlight">Important</p>
    <p title="This appears on hover">
        Hover over me
    </p>
    <p hidden>This is hidden</p>
</body>
</html>
